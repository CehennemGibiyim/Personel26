# ============================================================
#  Personel26 — Windows paketlerini GitHub üzerinde otomatik üretir
#  Çıktılar:
#    • Personel26-Portable.zip   (taşınabilir, kurulumsuz)
#    • Personel26-Kurulum.exe    (Inno Setup kurulum sihirbazı)
#
#  Nasıl çalıştırılır:
#    A) Elle: GitHub → Actions → "Windows Paketi" → Run workflow
#       → bitince sayfanın altındaki "Artifacts" bölümünden indirin.
#    B) Sürüm etiketiyle: git tag v1.0.0 && git push origin v1.0.0
#       → dosyalar otomatik olarak "Releases" sayfasına eklenir.
# ============================================================
name: Windows Paketi

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  paket:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      DATABASE_URL: "postgresql://derleme:derleme@127.0.0.1:5433/derleme"
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Taşınabilir paketi oluştur (derleme + Node + PostgreSQL)
        shell: pwsh
        run: ./windows/paket-olustur.ps1

      - name: Inno Setup kur
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Kurulum paketini derle (Personel26-Kurulum.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup derlemesi başarısız" }

      - name: Dosyaları yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Personel26-Windows
          path: |
            Personel26-Portable.zip
            windows/Personel26-Kurulum.exe
          retention-days: 30

      - name: Sürüm sayfasına ekle (yalnızca v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Personel26-Portable.zip
            windows/Personel26-Kurulum.exe

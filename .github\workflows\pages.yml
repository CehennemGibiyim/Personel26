# ============================================================
#  GitHub Pages — Personel26 TANITIM / ÖNİZLEME sayfası
#  main dalına her push'ta statik arayüz önizlemesini yayınlar:
#    https://KULLANICI.github.io/REPO/
#
#  NOT: GitHub Pages yalnızca statik dosya barındırır. Bu sayfa
#  sistemin görsel tanıtımıdır (veri girişi yapılamaz). Canlı,
#  veritabanlı tam sistem için WEB-YAYINLAMA.md → Vercel adımlarına bakın.
#
#  İlk kurulum: GitHub repo → Settings → Pages → Source: "GitHub Actions"
# ============================================================
name: GitHub Pages (tanıtım sayfası)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Statik önizlemeyi üret
        run: node scripts/build-uipreview.mjs

      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          cp public/panel-onizleme.html _site/index.html
          cp src/app/icon.svg _site/favicon.svg 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
